name: Package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: package-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: 20}
          - {os: ubuntu-latest, node: 22}
          - {os: ubuntu-latest, node: 24}
          - {os: macos-latest, node: 24}
          - {os: windows-latest, node: 24}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:release
      - run: npm run pack:check

  security:
    name: Secret and hook checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned secret scanner
        run: bash scripts/install-ci-gitleaks.sh
      - run: npm run scan:history
      - run: npm run test:hooks
      - run: npm ci
      - run: npm run build
      - run: npm run pack:check -- --scan

  required:
    name: Required checks
    if: always()
    needs: [package, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every platform and security check to pass
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$PACKAGE_RESULT" = success && test "$SECURITY_RESULT" = success
