name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yourbit-network/notibuddy'
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Verify release tag and package
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, 'notibuddy');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Only stable versions can publish to latest');
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Tag must match package.json version');
          assert.equal(lock.version, pkg.version, 'Update the lockfile version before tagging');
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(pkg.repository.url, 'git+https://github.com/yourbit-network/notibuddy.git');
          NODE

      - name: Install pinned secret scanner
        run: bash scripts/install-ci-gitleaks.sh
      - name: Scan release history and tag messages
        run: npm run scan:history
      - name: Test pre-push enforcement
        run: npm run test:hooks
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Test release safeguards
        run: npm run test:release
      - name: Pack, scan, and install the exact release archive
        run: npm run pack:check -- --scan
      - name: Publish with OIDC and provenance
        run: |
          archive=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('.build/release/pack.json'))[0].filename)")
          npm publish ".build/release/$archive" --ignore-scripts --access public --provenance --tag latest
      - name: Verify public registry contents and integrity
        run: npm run check:publication -- --wait

  homebrew:
    name: Update Homebrew tap formula
    needs: publish
    if: ${{ github.repository == 'yourbit-network/notibuddy' && secrets.HOMEBREW_TAP_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yourbit-network/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: true
      - name: Update Formula/notibuddy.rb
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';

          const version = (process.env.TAG_NAME ?? '').replace(/^v/, '');
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);

          const metaRes = await fetch(`https://registry.npmjs.org/notibuddy/${version}`, {
            headers: { Accept: 'application/json' },
            signal: AbortSignal.timeout(30_000),
          });
          assert.equal(metaRes.ok, true, `Failed to query registry metadata: HTTP ${metaRes.status}`);
          const meta = await metaRes.json();
          const url = `https://registry.npmjs.org/notibuddy/-/notibuddy-${version}.tgz`;
          assert.equal(meta.dist?.tarball, url, 'Unexpected tarball URL in npm metadata');

          const tgzRes = await fetch(url, { signal: AbortSignal.timeout(30_000) });
          assert.equal(tgzRes.ok, true, `Failed to download ${url}: HTTP ${tgzRes.status}`);
          const bytes = Buffer.from(await tgzRes.arrayBuffer());
          const sha512 = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          assert.equal(sha512, meta.dist?.integrity, 'Tarball sha512 mismatch against npm registry metadata');
          const sha256 = createHash('sha256').update(bytes).digest('hex');

          const formulaPath = 'Formula/notibuddy.rb';
          const original = readFileSync(formulaPath, 'utf8');
          const urlRe = /^(\s*url\s+)"[^"]+"$/m;
          const shaRe = /^(\s*sha256\s+)"[a-f0-9]{64}"$/m;
          assert.ok(urlRe.test(original), 'Missing url line in Formula/notibuddy.rb');
          assert.ok(shaRe.test(original), 'Missing sha256 line in Formula/notibuddy.rb');

          const updated = original
            .replace(urlRe, `$1"${url}"`)
            .replace(shaRe, `$1"${sha256}"`);
          if (updated === original) {
            console.log(`Formula/notibuddy.rb already targets ${version}`);
            process.exit(0);
          }

          writeFileSync(formulaPath, updated);
          const git = (...args) => execFileSync('git', args, { stdio: 'inherit' });
          git('config', 'user.name', 'Yourbit, LLC');
          git('config', 'user.email', 'github@yourbit.network');
          git('add', formulaPath);
          git('commit', '-m', `notibuddy ${version}`);
          try {
            git('push', 'origin', 'main');
          } catch {
            const branch = `bump-notibuddy-${version}`;
            git('checkout', '-B', branch);
            git('push', '-f', '-u', 'origin', branch);
            execFileSync('gh', [
              'pr', 'create',
              '--repo', 'yourbit-network/homebrew-tap',
              '--head', branch,
              '--base', 'main',
              '--title', `notibuddy ${version}`,
              '--body', `Automated Homebrew formula update for \`notibuddy@${version}\` published to npm.`,
            ], { stdio: 'inherit' });
          }
          NODE
