name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yourbit-network/notibuddy'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Verify release tag and package
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, 'notibuddy');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Only stable versions can publish to latest');
          assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Tag must match package.json version');
          assert.equal(lock.version, pkg.version, 'Update the lockfile version before tagging');
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(pkg.repository.url, 'git+https://github.com/yourbit-network/notibuddy.git');
          NODE

      - name: Install pinned secret scanner
        run: bash scripts/install-ci-gitleaks.sh
      - name: Scan release history and tag messages
        run: npm run scan:history
      - name: Test pre-push enforcement
        run: npm run test:hooks
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Test release safeguards
        run: npm run test:release
      - name: Pack, scan, and install the exact release archive
        run: npm run pack:check -- --scan
      - name: Publish with OIDC and provenance
        run: |
          archive=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('.build/release/pack.json'))[0].filename)")
          npm publish ".build/release/$archive" --ignore-scripts --access public --provenance --tag latest
      - name: Verify public registry contents and integrity
        run: npm run check:publication -- --wait
